<div class="flex items-center justify-between pt-4">
  <button
    type="button"
    (click)="previous()"
    [disabled]="page() === 0"
    class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400"
  >
    Anterior
  </button>

  <span class="text-sm text-slate-500"> Página {{ page() + 1 }} de {{ totalPages() }} </span>

  <button
    type="button"
    (click)="next()"
    [disabled]="page() >= totalPages() - 1"
    class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400"
  >
    Siguiente
  </button>
</div>
