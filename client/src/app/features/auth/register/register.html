<main class="min-h-screen bg-slate-100 px-4 py-8">
  <div class="mx-auto w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-slate-900">Crear cuenta</h1>
      <p class="mt-2 text-sm text-slate-600">Regístrate para continuar en JobConnect</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="fullName" class="mb-2 block text-sm font-medium text-slate-700">Nombre completo</label>
        <input
          id="fullName"
          type="text"
          formControlName="fullName"
          autocomplete="name"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        />
      </div>

      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        />
      </div>

      <div>
        <label for="phone" class="mb-2 block text-sm font-medium text-slate-700">Teléfono (opcional)</label>
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          autocomplete="tel"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        />
      </div>

      <div>
        <label for="role" class="mb-2 block text-sm font-medium text-slate-700">Tipo de cuenta</label>
        <select
          id="role"
          formControlName="role"
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        >
          <option value="CLIENT">Cliente</option>
          <option value="PROFESSIONAL">Profesional</option>
        </select>
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        />
      </div>

      <div>
        <label for="confirmPassword" class="mb-2 block text-sm font-medium text-slate-700">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        />
      </div>

      @if (errorMessage()) {
        <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:bg-slate-500"
      >
        {{ isSubmitting() ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="font-medium text-slate-900 hover:underline">Inicia sesión</a>
    </p>
  </div>
</main>
